name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test-front:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_legacy_peer_deps: true

      - name: Lint
        run: npm run lint

      - name: Build App
        run: npm run build:irrtirer

      - name: Run tests with coverage
        run: npm test -- --coverage --watch=false

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload coverage report (irrtirer)
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage-irrtirer
          path: frontend/coverage/irrtirer

      - name: Upload coverage report (active-canvas)
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage-active-canvas
          path: frontend/coverage/active-canvas

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist/irrtirer/browser